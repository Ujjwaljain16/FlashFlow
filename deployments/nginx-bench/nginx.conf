# Minimal reverse-proxy config for the Stage 8 NGINX reference
# benchmark (scripts/nginx-reference-benchmark.sh). Proxies every
# request straight through to the same cmd/http-origin instance
# FlashFlow's own cmd/proxy fronts in the paired comparison run --
# both proxies sit in front of the byte-for-byte identical backend, so
# the only thing being compared is each proxy's own overhead.
worker_processes 1;
events {
    worker_connections 256;
}
http {
    access_log off;
    server {
        listen 80;
        location / {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
